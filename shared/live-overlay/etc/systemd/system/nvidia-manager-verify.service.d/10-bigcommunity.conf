[Unit]
ConditionPathExists=/livefs-pkgs.txt
ConditionPathExists=/opt/mhwd/pacman-mhwd.conf
ConditionFileIsExecutable=/usr/lib/biglinux-livecd/shims/mkinitcpio
ConditionKernelCommandLine=driver=nonfree

[Service]
# Keep legacy fallback installs offline and skip live initramfs regeneration.
BindReadOnlyPaths=/opt/mhwd/pacman-mhwd.conf:/etc/pacman.conf
BindReadOnlyPaths=/usr/lib/biglinux-livecd/shims/mkinitcpio:/usr/bin/mkinitcpio
TimeoutStartSec=60s
TimeoutStopSec=5s
KillMode=control-group
