# Big WindowMaker: o big-driver-manager-gpu.service (big-driver-manager-cli,
# BigLinux) roda antes da tela de login e, antes de olhar o hardware, lista
# todos os pacotes instalados (pacman -Qq). Num disco rígido, a frio, isso
# segurava a tela de login por ~6 s (OptiPlex 760: 6,2 s no
# systemd-analyze), e numa máquina sem NVIDIA o serviço não faz nada: o
# "gpu boot" só age na mídia live (/livefs-pkgs.txt), numa máquina híbrida
# (NVIDIA ao lado de Intel ou AMD) ou numa placa NVIDIA que ficou sem o
# driver proprietário instalado; os dois últimos exigem a placa NVIDIA.
# A condição abaixo é esse mesmo teste, pelo fabricante PCI (0x10de); com
# NVIDIA, ou no live, nada muda.
[Service]
ExecCondition=/bin/sh -c 'test -e /livefs-pkgs.txt || grep -qsx 0x10de /sys/bus/pci/devices/*/vendor'
