# Big WindowMaker: o auto-unlock-pacman (pacman-fix-keys) roda a cada boot
# (~10 s num disco rígido, OptiPlex 760) em paralelo com a tela de login e
# com o primeiro login, disputando o disco com o Xorg e a sessão. Continua
# rodando a cada boot; só cede a CPU e o disco a quem o usuário está
# esperando.
[Service]
Nice=19
IOSchedulingClass=idle
