# /etc/ufw/ufw.conf
#

# Set to yes to start on boot. If setting this remotely, be sure to add a rule
# to allow your remote connection before starting ufw. Eg: 'ufw allow 22/tcp'
#
# Big WindowMaker: desligado por padrão (ligado, bloqueava o SSH e outras
# entradas sem o usuário saber); "sudo ufw enable" o liga com as regras deste
# diretório (Samba e mDNS), e o ufw.service habilitado o mantém nos boots.
ENABLED=no

# Please use the 'ufw' command to set the loglevel. Eg: 'ufw logging medium'.
# See 'man ufw' for details.
LOGLEVEL=low
