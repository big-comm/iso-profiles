# /etc/ufw/ufw.conf
#

# Set to yes to start on boot. If setting this remotely, be sure to add a rule
# to allow your remote connection before starting ufw. Eg: 'ufw allow 22/tcp'
#
# Big WindowMaker: ligado por padrao, nega entradas exceto as regras de
# user.rules (Samba, mDNS e SSH); "sudo ufw disable" o desliga. Mantenha este
# arquivo em ASCII: o ufw o regrava em ASCII e falha (UnicodeEncodeError) em
# "ufw enable"/"ufw disable" se houver acentos.
ENABLED=yes

# Please use the 'ufw' command to set the loglevel. Eg: 'ufw logging medium'.
# See 'man ufw' for details.
LOGLEVEL=low
