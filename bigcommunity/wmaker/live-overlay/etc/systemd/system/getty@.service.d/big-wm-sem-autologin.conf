# O getty@.service do live-overlay compartilhado faz login automático como
# "community", o usuário das edições BigCommunity; aqui o usuário é
# bigwindowmaker, e o login do tty1 falhava e reiniciava a cada 3 s, sem
# fim. A sessão live entra pela tela gráfica (wdm); o console fica com o
# getty comum.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear - ${TERM}
