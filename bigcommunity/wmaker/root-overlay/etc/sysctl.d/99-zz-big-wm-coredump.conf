# Big WindowMaker: os travamentos ficam registrados (coredumpctl), para o
# Menu > Relatar problema (big-wm-doctor --report) poder contar quais
# programas caíram. O auto-rules-io (99-games-tweaks.conf) manda os dumps
# para /bin/false; este arquivo vem depois na ordem do sysctl.d e devolve o
# padrão do systemd (/usr/lib/sysctl.d/50-coredump.conf; o teste
# tests/test_wmaker_coredump.py confere que a linha é a mesma). O tamanho
# fica limitado em systemd/coredump.conf.d/zz-big-wm.conf.
kernel.core_pattern=|/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %h %d %F %I
