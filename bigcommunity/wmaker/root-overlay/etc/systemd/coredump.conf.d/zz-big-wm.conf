# Big WindowMaker: guarda os travamentos, com limite. O
# biglinux-improve-compatibility cria custom.conf com Storage=none; este
# arquivo vem depois na ordem e vale. Processos maiores que 512 MB (jogos,
# navegadores grandes) continuam sem dump: só o registro no journal.
[Coredump]
Storage=external
ProcessSizeMax=512M
ExternalSizeMax=512M
MaxUse=1G
