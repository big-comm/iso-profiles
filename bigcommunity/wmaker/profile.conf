##########################################
###### use this file in the profile ######
##########################################

# use multilib packages; x86_64 only
multilib="true"

# Tela de login da ISO: wdm (WINGs Display Manager), a mesma do sistema
# instalado. O manjaro-tools habilita a unidade (systemctl enable wdm) na
# imagem. No boot do Live o wdm entra direto como bigwindowmaker
# (wdmAutoLogin, live-overlay/etc/wdm); ao sair da sessão, a tela pede a
# senha big (ajuda F1). O LightDM continua instalado (o módulo
# displaymanager do Calamares o configura) mas não é habilitado.
displaymanager="wdm"

# Set to false to disable autologin in the livecd
# autologin="true"

# nonfree mhwd drivers
nonfree_mhwd="true"

# use extra packages as defined in pkglist to activate a full profile
extra="false"
# extra="true"

# not used by Manjaro BuildIso
label="BigCommunity.iso"

################ install ################

# unset defaults to given value
# efi_boot_loader="grub"

# configure calamares for netinstall
# netinstall="false"

# configure calamares to use chrootcfg instead of unpackfs
# chrootcfg="false"

# use geoip for localization
geoip='true'

# add strict snaps: strict_snaps="core core18 gnome-3-28-1804 gtk-common-themes snap-store"
# strict_snaps=""
# add classic snaps: classic_snaps="code"
# classic_snaps=""
# choose the snap channel. Possible options are: stable, candidate, beta, edge
# snap_channel="candidate"

# unset defaults to given values
# names must match systemd service names
#enable_systemd=('bluetooth' 'cronie' 'ModemManager' 'NetworkManager' 'cups' 'haveged' 'fstrim.timer' 'pkgfile-update.timer')
# big-wm-grub-resolucao: no primeiro boot do sistema instalado, a resolução
# do GRUB pelo monitor (grub-theme-big-wm); não roda no Live (misobasedir)
# big-wm-intel-gen4: antes da tela de login, o driver intel (SNA) nas placas
# Intel Gen4, no Live e no sistema instalado (big-wm-session)
enable_systemd=('systemd-timesyncd' 'bluetooth' 'cronie' 'ModemManager' 'NetworkManager' 'cups' 'vboxservice' 'ufw' 'avahi-daemon' 'smb' 'cups-browsed' 'big-wm-grub-resolucao' 'big-wm-intel-gen4')
enable_systemd_timers=(pkgfile-update.timer fstrim.timer)
#disable_systemd=('avahi-daemon' 'pacman-init')
#disable_systemd=('avahi-daemon' 'pacman-init')
# the same workgroup name if samba is used
# smb_workgroup=""

################# livecd #################

# unset defaults to given value
hostname="big-windowmaker"

# unset defaults to given value
username="bigwindowmaker"

# unset defaults to given value
password="big"

# the login shell
# defaults to bash
# login_shell=/bin/bash
login_shell=/bin/bash

# unset defaults to given values
#xaddgroups="lp,network,power,wheel,sambashare,audio"
addgroups="lp,network,power,wheel,sambashare,users,storage,input,audio"

# unset defaults to given values
# names must match systemd service names
# services in enable_systemd array don't need to be listed here
# enable_systemd_live=('manjaro-live' 'mhwd-live' 'pacman-init' 'mirrors-live')
# enable_systemd_live=('manjaro-live' 'mhwd-live' 'pacman-init' 'mirrors-live')
#disable_systemd_live=('tlp' 'tlp-sleep')
disable_systemd_live=('mhwd-live' 'mirrors-live' 'pacman-init' 'ufw' 'fstrim.timer' 'big-btrfs-balance' 'auto-unlock-pacman' 'cronie' 'cups' 'cups-browsed' 'smb' 'avahi-daemon' 'ModemManager' 'pkgfile-update.timer' 'systemd-userdbd')

#custom_boot_args=('splash')
